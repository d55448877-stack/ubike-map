<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWP08 影像互動遊戲</title>
  <!-- 載入 TensorFlow.js 與 Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3d;
      --text-color: #ffffff;
      --accent-color: #00d2d3;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.5s ease; /* 互動背景過渡效果 */
    }

    h1 { margin-bottom: 10px; color: var(--accent-color); }

    .instructions {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 900px;
      width: 100%;
    }

    .webcam-card, .status-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 300px;
    }

    #webcam-container canvas {
      border-radius: 12px;
      border: 3px solid #48dbfb;
      box-shadow: 0 0 15px rgba(72, 219, 251, 0.4);
    }

    .label-container {
      width: 100%;
      margin-top: 15px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      background: #181825;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-weight: bold;
    }

    .progress-bar {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.2s;
    }

    /* 遊戲互動反饋區域 */
    .game-feedback {
      margin-top: 15px;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      width: 100%;
      background: #181825;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background: var(--accent-color);
      color: #111;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <h1>🎮 SWP08 影像互動遊戲</h1>

  <!-- 說明區域 -->
  <div class="instructions">
    <h3>📖 遊戲與操作說明：</h3>
    <ol style="padding-left: 20px; line-height: 1.6;">
      <li>點擊下方「啟動攝影機」按鈕授權視訊權限。</li>
      <li>在攝影機前展示動作：
        <ul>
          <li><b>類別 1 (Class 1)</b>：畫面切換為綠色，顯示「🎉 辨識成功：動作 A！」</li>
          <li><b>類別 2 (Class 2)</b>：畫面切換為紫色，顯示「⚡ 辨識成功：動作 B！」</li>
        </ul>
      </li>
      <li>實時顯示視訊鏡頭與辨識信心分數（Confidence Score）。</li>
    </ol>
  </div>

  <button onclick="init()">📷 啟動攝影機辨識</button>

  <div class="main-container">
    <!-- 攝影機畫面 -->
    <div class="webcam-card">
      <h3>即時攝影機畫面</h3>
      <div id="webcam-container"></div>
    </div>

    <!-- 辨識結果與反饋 -->
    <div class="status-card">
      <h3>辨識結果與信心分數</h3>
      <div class="label-container" id="label-container"></div>
      
      <div style="width:100%; margin-top:20px;">
        <h3>畫面互動反饋</h3>
        <div class="game-feedback" id="feedback-box">等待攝影機啟動...</div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請替換為你在 Teachable Machine 訓練並匯出的模型 URL
    const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      // 載入模型
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      // 設定攝影機 (寬 320, 高 320, 啟用鏡像翻轉)
      const flip = true;
      webcam = new tmImage.Webcam(320, 320, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      // 將攝影機畫布附加到頁面
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      
      // 初始化信心分數顯示欄位
      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        const row = document.createElement("div");
        row.id = `label-row-${i}`;
        row.className = "label-row-wrapper";
        row.innerHTML = `
          <div class="label-row">
            <span id="class-name-${i}">Class</span>
            <span id="class-score-${i}">0%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="fill-${i}"></div></div>
        `;
        labelContainer.appendChild(row);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let highestProb = 0;
      let bestClass = "";

      for (let i = 0; i < maxPredictions; i++) {
        const className = prediction[i].className;
        const probability = prediction[i].probability;
        const percentage = (probability * 100).toFixed(1) + "%";

        document.getElementById(`class-name-${i}`).innerText = className;
        document.getElementById(`class-score-${i}`).innerText = percentage;
        document.getElementById(`fill-${i}`).style.width = percentage;

        if (probability > highestProb) {
          highestProb = probability;
          bestClass = className;
        }
      }

      // 依辨識結果觸發畫面變化（背景色與訊息文字）
      triggerInteraction(bestClass, highestProb);
    }

    function triggerInteraction(className, confidence) {
      const feedbackBox = document.getElementById("feedback-box");
      if (confidence < 0.7) {
        feedbackBox.innerText = "🤔 辨識中 / 信心度不足...";
        document.body.style.backgroundColor = "#1e1e2e";
        return;
      }

      // 假設你訓練的兩個類別名稱分別為 "Class 1" 與 "Class 2"
      if (className === "Class 1") {
        document.body.style.backgroundColor = "#1e3799"; // 變更藍背景
        feedbackBox.innerHTML = "🎉 觸發效果：<br>檢測到 【Class 1】！";
      } else if (className === "Class 2") {
        document.body.style.backgroundColor = "#6d214f"; // 變更紫背景
        feedbackBox.innerHTML = "⚡ 觸發效果：<br>檢測到 【Class 2】！";
      } else {
        document.body.style.backgroundColor = "#1e1e2e";
        feedbackBox.innerText = `辨識為: ${className}`;
      }
    }
  </script>
</body>
</html>
